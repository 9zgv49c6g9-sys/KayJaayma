var fmt=function(n){return new Intl.NumberFormat('fr-FR').format(Number(n)||0)};
var fdate=function(d){return d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):''};
function ago(d){var s=(Date.now()-new Date(d).getTime())/1000;if(s<3600)return 'il y a '+Math.max(1,Math.round(s/60))+' min';if(s<86400)return 'il y a '+Math.round(s/3600)+' h';if(s<2592000)return 'il y a '+Math.round(s/86400)+' j';return fdate(d)}
function catName(slug){var c=S.cats.filter(function(x){return x.slug===slug})[0];return c?c.name:slug}
function ico(slug){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[slug]||'<rect x="4" y="4" width="16" height="16" rx="3"/>')+'</svg>'}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},bad?6000:3500)}
function isAdmin(){return S.profile&&S.profile.role==='admin'}
function isSeller(){return S.profile&&(S.profile.role==='seller'||S.profile.role==='admin')}
function waLink(num,title){var d=String(num||'').replace(/\D/g,'');if(d.length===9&&d[0]==='7')d='221'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent('Bonjour, je suis intéressé(e) par votre annonce « '+title+' » sur KAY JAAYMA.')}
function db(){ if(!sb){toast('La base de données n’est pas connectée. Ouvrez la page Configuration.',true);return false} return true }
async function run(p){ try{ var r=await p; if(r&&r.error){toast(r.error.message||'Une erreur est survenue',true)} return r||{} }catch(e){toast('Connexion impossible. Vérifiez votre réseau.',true);return {error:e}} }

var VIEWS=['accueil','annonces','annonce','boutique','connexion','favoris','vendeur','admin','tarifs','configuration'];
function go(name,p){S.p=p||{};S.menu=false;if(location.hash.slice(1)===name){render()}else{location.hash=name}window.scrollTo(0,0)}
function cur(){var n=location.hash.slice(1)||'accueil';return n}
window.addEventListener('hashchange',render);

/* ---------- données ---------- */
async function loadCats(){ if(!sb)return; var r=await sb.from('categories').select('*').order('sort'); if(r.data&&r.data.length)S.cats=r.data }
async function loadPricing(){ if(!sb)return; var r=await sb.from('pricing').select('*').order('amount'); if(r.data&&r.data.length)S.pricing=r.data; var s=await sb.from('site_settings').select('*').eq('key','payment_instructions').maybeSingle(); if(s.data)S.pay=s.data.value }
async function loadProfile(){
  if(!sb||!S.user){S.profile=null;S.favs=new Set();return}
  var r=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle(); S.profile=r.data||null;
  var f=await sb.from('favorites').select('listing_id'); S.favs=new Set((f.data||[]).map(function(x){return x.listing_id}));
}
async function fetchListings(o){
  if(!sb)return[];
  var r=sb.from('listings').select('*, profiles(full_name,shop_name,is_pro)').eq('status','published');
  if(o.cat)r=r.eq('category',o.cat); if(o.region)r=r.eq('region',o.region); if(o.cond)r=r.eq('condition',o.cond);
  if(o.min)r=r.gte('price',o.min); if(o.max)r=r.lte('price',o.max); if(o.seller)r=r.eq('seller_id',o.seller);
  if(o.ids)r=r.in('id',o.ids.length?o.ids:['00000000-0000-0000-0000-000000000000']);
  if(o.q){var q=o.q.replace(/[%,()*]/g,' ').trim();if(q)r=r.or('title.ilike.%'+q+'%,description.ilike.%'+q+'%')}
  if(o.featured)r=r.gt('featured_until',new Date().toISOString());
  r=r.order('created_at',{ascending:false}).range(o.offset||0,(o.offset||0)+(o.limit||24)-1);
  var x=await run(r); return x.data||[];
}

function card(l){
  var fe=l.featured_until&&new Date(l.featured_until)>new Date();

  return '<button class="card" data-act="open" data-id="'+esc(l.id)+'"><div class="ph">'+(img?'<img src="'+esc(img)+'" alt="'+esc(l.title)+'" loading="lazy" decoding="async">':ico(l.category))+
   '<div class="badges">'+(fe?'<span class="bd sun">Sponsorisé</span>':'')+(l.urgent?'<span class="bd red">Urgent</span>':'')+'<span class="bd">'+(l.condition==='neuf'?'Neuf':'Occasion')+'</span></div></div>'+

}
function grid(list,emptyT,emptyD){
  if(!list.length)return '<div class="empty"><b>'+esc(emptyT||'Aucune annonce pour le moment')+'</b>'+esc(emptyD||'Les annonces validées apparaîtront ici.')+'</div>';
  return '<div class="grid">'+list.map(card).join('')+'</div>';
}

function catOpts(sel,all){return (all?'<option value="">'+all+'</option>':'')+S.cats.map(function(c){return '<option value="'+esc(c.slug)+'"'+(c.slug===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')}

/* ----- espace vendeur ----- */
V.vendeur=async function(){
  if(!S.user)return gate('Connectez-vous pour accéder à votre espace vendeur.');
  if(!S.profile)return '<div class="pg"><div class="empty"><b>Profil introuvable</b>Reconnectez-vous ou vérifiez que schema.sql a été exécuté.</div></div>';
  if(!isSeller())return '<div class="pg"><div class="cta"><div><h2>Passer en compte vendeur</h2><p style="margin-top:.5rem">Votre compte est un compte acheteur. Activez l’espace vendeur pour publier des annonces et ouvrir votre boutique.</p></div><button class="btn" data-act="become-seller">Activer mon espace vendeur</button></div></div>';
  var tab=(S.tab&&S.tab.indexOf('a-')!==0)?S.tab:'annonces';
  var tabs=[['annonces','Mes annonces'],['form',S.edit?'Modifier l’annonce':'Publier'],['boutique','Ma boutique'],['offres','Offres et commandes']];
  var body='';
  if(tab==='annonces')body=await vAds();
  else if(tab==='form')body=vForm();
  else if(tab==='boutique')body=vShop();
  else body=await vOffers();
  return '<div class="pg"><h1 style="font-size:2rem">Mon espace vendeur</h1><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===tab)+'" data-act="tab" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+body+'</div>';
};
var STAT={pending:'En attente',published:'Publiée',rejected:'Refusée',sold:'Vendu'};
async function vAds(){
  var r=await run(sb.from('listings').select('*').eq('seller_id',S.user.id).order('created_at',{ascending:false}));
  var l=r.data||[]; S.mine=l;
  var tv=l.reduce(function(a,x){return a+(x.views||0)},0);
  var k='<div class="kpis"><div class="kpi"><b>'+l.length+'</b><span>annonces</span></div><div class="kpi"><b>'+l.filter(function(x){return x.status==='published'}).length+'</b><span>publiées</span></div><div class="kpi"><b>'+l.filter(function(x){return x.status==='pending'}).length+'</b><span>en attente de validation</span></div><div class="kpi"><b>'+fmt(tv)+'</b><span>consultations au total</span></div></div>';
  if(!l.length)return k+'<div class="empty"><b>Vous n’avez pas encore d’annonce</b><br><button class="btn" data-act="tab" data-tab="form">Publier ma première annonce</button></div>';
  return k+'<div class="tw"><table><thead><tr><th>Annonce</th><th>Prix</th><th>État</th><th>Vues</th><th>Actions</th></tr></thead><tbody>'+l.map(function(x){
    var fe=x.featured_until&&new Date(x.featured_until)>new Date();
    return '<tr><td><b>'+esc(x.title)+'</b><br><span class="meta">'+esc(x.region)+' · '+fdate(x.created_at)+'</span></td><td>'+fmt(x.price)+'</td><td><span class="pill '+x.status+'">'+STAT[x.status]+'</span>'+(fe?'<br><span class="bd sun">Sponsorisée jusqu’au '+fdate(x.featured_until)+'</span>':'')+'</td><td>'+(x.views||0)+'</td><td>'+
     (x.status==='published'?'<button class="btn sm ghost" data-act="open" data-id="'+x.id+'">Voir</button>':'')+'<button class="btn sm ghost" data-act="edit" data-id="'+x.id+'">Modifier</button>'+
     (x.status==='published'?'<button class="btn sm ghost" data-act="order" data-kind="featured_7d" data-id="'+x.id+'">Mettre en avant</button><button class="btn sm ghost" data-act="order" data-kind="urgent_badge" data-id="'+x.id+'">Urgent</button><button class="btn sm ghost" data-act="sold" data-id="'+x.id+'">Marquer vendu</button>':'')+
     '<button class="btn sm danger" data-act="del-listing" data-id="'+x.id+'">Supprimer</button></td></tr>'}).join('')+'</tbody></table></div>';
}

V.admin=async function(){
  if(!S.user)return gate('Connectez-vous avec un compte administrateur.');
  if(!isAdmin())return '<div class="pg"><div class="empty"><b>Accès réservé</b>Cette section est réservée aux comptes administrateurs.</div></div>';
  var tab=S.tab&&S.tab.indexOf('a-')===0?S.tab:'a-stats';
  var tabs=[['a-stats','Statistiques'],['a-listings','Annonces'],['a-users','Utilisateurs'],['a-reports','Signalements'],['a-cats','Catégories'],['a-prices','Tarifs'],['a-orders','Commandes'],['a-ads','Publicités']];
  var body=await ({'a-stats':aStats,'a-listings':aListings,'a-users':aUsers,'a-reports':aReports,'a-cats':aCats,'a-prices':aPrices,'a-orders':aOrders,'a-ads':aAds}[tab])();
  return '<div class="pg"><h1 style="font-size:2rem">Administration</h1><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===tab)+'" data-act="tab" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+body+'</div>';
};
async function cnt(t,f){var q=sb.from(t).select('*',{count:'exact',head:true});if(f)q=f(q);var r=await q;return r.count||0}
async function aStats(){
  var a=await Promise.all([cnt('profiles'),cnt('profiles',function(q){return q.eq('role','seller')}),cnt('listings'),cnt('listings',function(q){return q.eq('status','pending')}),cnt('reports',function(q){return q.eq('status','open')}),cnt('orders',function(q){return q.eq('status','pending')})]);
  var rv=await run(sb.from('orders').select('amount').eq('status','paid').limit(10000)); var rev=(rv.data||[]).reduce(function(s,x){return s+x.amount},0);
  var K=function(n,l){return '<div class="kpi"><b>'+fmt(n)+'</b><span>'+l+'</span></div>'};
  return '<div class="kpis" style="margin-top:1rem">'+K(a[0],'utilisateurs')+K(a[1],'vendeurs')+K(a[2],'annonces')+K(a[3],'annonces à valider')+K(a[4],'signalements ouverts')+K(a[5],'commandes en attente')+K(rev,'FCFA de revenus confirmés')+'</div>';
}
async function aListings(){
  var f=S.af||'pending';
  var q=sb.from('listings').select('*, profiles(full_name,shop_name)').order('created_at',{ascending:false}).limit(100); if(f!=='all')q=q.eq('status',f);
  var r=await run(q); var l=r.data||[];
  return '<div style="display:grid;gap:1rem;margin-top:1rem"><div class="f" style="max-width:240px"><label for="af">Afficher</label><select id="af" data-chg="af">'+[['pending','À valider'],['published','Publiées'],['rejected','Refusées'],['sold','Vendues'],['all','Toutes']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===f?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
   (l.length?'<div class="tw"><table><thead><tr><th>Annonce</th><th>Vendeur</th><th>Prix</th><th>État</th><th>Actions</th></tr></thead><tbody>'+l.map(function(x){var sp=x.profiles||{};return '<tr><td><b>'+esc(x.title)+'</b><br><span class="meta">'+esc(catName(x.category))+' · '+esc(x.region)+'</span></td><td>'+esc(sp.shop_name||sp.full_name||'')+'<br><span class="meta">'+esc(x.whatsapp)+'</span></td><td>'+fmt(x.price)+'</td><td><span class="pill '+x.status+'">'+STAT[x.status]+'</span></td><td><button class="btn sm ghost" data-act="open" data-id="'+x.id+'">Voir</button>'+(x.status!=='published'?'<button class="btn sm" data-act="set-status" data-s="published" data-id="'+x.id+'">Valider</button>':'')+(x.status!=='rejected'?'<button class="btn sm ghost" data-act="set-status" data-s="rejected" data-id="'+x.id+'">Refuser</button>':'')+'<button class="btn sm danger" data-act="adm-del" data-id="'+x.id+'">Supprimer</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty"><b>Rien à afficher</b>Aucune annonce dans cette catégorie.</div>')+'</div>';
}
async function aUsers(){

async function aAds(){
  var r=await run(sb.from('ads').select('*').order('created_at',{ascending:false})); var l=r.data||[];
  return '<div style="display:grid;gap:1rem;margin-top:1rem">'+(l.length?'<div class="tw"><table><thead><tr><th>Publicité</th><th>Fin</th><th>Statut</th><th></th></tr></thead><tbody>'+l.map(function(a){return '<tr><td><b>'+esc(a.title)+'</b><br><span class="meta">'+esc(a.link_url||'')+'</span></td><td>'+(a.ends_at?fdate(a.ends_at):'Sans fin')+'</td><td><span class="pill '+(a.active?'published':'cancelled')+'">'+(a.active?'Active':'Désactivée')+'</span></td><td><button class="btn sm ghost" data-act="ad-toggle" data-id="'+a.id+'" data-v="'+(!a.active)+'">'+(a.active?'Désactiver':'Activer')+'</button><button class="btn sm danger" data-act="ad-del" data-id="'+a.id+'">Supprimer</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty"><b>Aucune publicité</b>Ajoutez la première ci-dessous.</div>')+
   '<form class="form" data-form="newad"><h3>Ajouter une publicité sponsorisée</h3><div class="f"><label for="adt">Texte</label><input id="adt" name="title" required maxlength="100"></div><div class="row2"><div class="f"><label for="adl">Lien de destination</label><input id="adl" name="link" type="url" placeholder="https://"></div><div class="f"><label for="adi">Adresse de l’image</label><input id="adi" name="image" type="url" placeholder="https://"></div></div><div class="f"><label for="ade">Date de fin (facultatif)</label><input id="ade" name="ends" type="date"></div><button class="btn" type="submit" style="justify-self:start">Publier la publicité</button></form></div>';
}

/* ---------- rendu ---------- */
async function render(){
  var name=cur(); var my=++S.tok;
  head(); foot();
  if(VIEWS.indexOf(name)<0){$('#app').innerHTML='<div class="pg"><div class="empty"><b>Page introuvable</b>Cette adresse n’existe pas.<br><br><button class="btn" data-act="nav" data-to="accueil">Retour à l’accueil</button></div></div>';return}
  var app=$('#app'); app.innerHTML='<div class="pg"><div class="sk"></div><div class="sk" style="height:120px"></div></div>';
  var html; try{html=await V[name]()}catch(e){html='<div class="pg"><div class="empty"><b>Une erreur est survenue</b>Rechargez la page. Si le problème continue, vérifiez la configuration.</div></div>'}
  if(my!==S.tok||html==null)return;
  app.innerHTML=html;
}

/* ---------- actions ---------- */
function armed(el){ if(el.dataset.armed){return true} el.dataset.armed='1';var t=el.textContent;el.textContent='Confirmer';setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=t}},4000);return false }
function digits(s){return String(s||'').replace(/\D/g,'')}
async function applyOrder(o){
  var now=new Date();
  if(o.kind==='featured_7d'&&o.listing_id){await run(sb.from('listings').update({featured_until:new Date(now.getTime()+7*864e5).toISOString()}).eq('id',o.listing_id))}
  if(o.kind==='urgent_badge'&&o.listing_id){await run(sb.from('listings').update({urgent:true}).eq('id',o.listing_id))}
  if(o.kind==='pro_monthly'){await run(sb.from('profiles').update({is_pro:true,pro_until:new Date(now.getTime()+30*864e5).toISOString()}).eq('id',o.user_id))}
}
var ACT={
 nav:function(el){go(el.dataset.to)},
 menu:function(){S.menu=!S.menu;head()},
 auth:function(el){S.p={mode:el.dataset.mode};go('connexion',{mode:el.dataset.mode})},
 post:function(){ if(!S.user){go('connexion',{mode:'up',role:'seller'});toast('Créez un compte vendeur pour déposer une annonce.');return} S.tab='form';S.edit=null;S.formImgs=[];go('vendeur') },
 'seller-cta':function(){ if(S.user){S.tab='form';S.edit=null;S.formImgs=[];go('vendeur')}else go('connexion',{mode:'up',role:'seller'}) },
 cat:function(el){go('annonces',{cat:el.dataset.slug})},
 region:function(el){go('annonces',{region:el.dataset.r})},
 open:function(el){go('annonce',{id:el.dataset.id})},
 shop:function(el){go('boutique',{id:el.dataset.id})},
 thumb:function(el){var b=$('#bigimg');b.innerHTML='<img src="'+esc(el.dataset.src)+'" alt="">';document.querySelectorAll('.thumbs button').forEach(function(x){x.removeAttribute('aria-current')});el.setAttribute('aria-current','true')},
 'report-open':function(){var f=$('#repf');f.hidden=!f.hidden},
 fav:async function(el){
  if(!S.user){toast('Connectez-vous pour utiliser les favoris.',true);go('connexion',{mode:'in'});return}
  var id=el.dataset.id,on=S.favs.has(id);
  var r=on?await run(sb.from('favorites').delete().eq('listing_id',id).eq('user_id',S.user.id)):await run(sb.from('favorites').insert({user_id:S.user.id,listing_id:id}));
  if(r.error)return; on?S.favs.delete(id):S.favs.add(id);
  el.textContent=on?'Ajouter aux favoris':'Retirer des favoris';el.setAttribute('aria-pressed',String(!on));toast(on?'Retiré des favoris':'Ajouté aux favoris');
 },
 more:async function(el){
  var p=S.p; var more=await fetchListings({q:p.q,region:p.region,cat:p.cat,cond:p.cond,min:p.min,max:p.max,limit:24,offset:(S.list||[]).length});
  S.list=(S.list||[]).concat(more); $('#results').innerHTML=grid(S.list); if(more.length<24)el.remove();
 },
 logout:async function(){ if(sb)await sb.auth.signOut(); S.user=null;S.profile=null;S.favs=new Set();S.tab=null;toast('Vous êtes déconnecté.');go('accueil') },
 reset:async function(){
  var em=($('#ae')||{}).value; if(!em){toast('Saisissez votre email, puis cliquez sur « Mot de passe oublié ».',true);return} if(!db())return;
  var r=await run(sb.auth.resetPasswordForEmail(em)); if(!r.error)toast('Un email de réinitialisation vient d’être envoyé.');
 },
 'cfg-clear':function(){try{localStorage.removeItem('kj_url');localStorage.removeItem('kj_key')}catch(e){} toast('Configuration effacée. Rechargement…');setTimeout(function(){location.reload()},700)},
 tab:function(el){S.tab=el.dataset.tab;if(S.tab!=='form'){S.edit=null;S.formImgs=[]}render()},
 'become-seller':async function(){ if(!db())return; var r=await run(sb.from('profiles').update({role:'seller'}).eq('id',S.user.id)); if(!r.error){await loadProfile();toast('Votre espace vendeur est activé.');render()} },
 edit:function(el){var l=(S.mine||[]).filter(function(x){return x.id===el.dataset.id})[0];if(!l)return;S.edit=l;S.formImgs=(l.images||[]).slice();S.tab='form';render();window.scrollTo(0,0)},
 'edit-cancel':function(){S.edit=null;S.formImgs=[];S.tab='annonces';render()},
 'rm-img':function(el){S.formImgs.splice(Number(el.dataset.i),1);var f=$('[data-form=listing]');keepForm(f);render()},
 'del-listing':async function(el){ if(!armed(el))return; var r=await run(sb.from('listings').delete().eq('id',el.dataset.id)); if(!r.error){toast('Annonce supprimée.');render()} },
 sold:async function(el){ var r=await run(sb.from('listings').update({status:'sold'}).eq('id',el.dataset.id)); if(!r.error){toast('Annonce marquée comme vendue.');render()} },
 order:async function(el){
  var r=await run(sb.from('orders').insert({user_id:S.user.id,kind:el.dataset.kind,listing_id:el.dataset.id||null}));
  if(!r.error){await loadPricing();toast('Commande enregistrée. '+(S.pay||PAYDEF));S.tab='offres';render()}
 },
 'set-status':async function(el){ var r=await run(sb.from('listings').update({status:el.dataset.s}).eq('id',el.dataset.id)); if(!r.error){toast(el.dataset.s==='published'?'Annonce validée et publiée.':'Annonce refusée.');render()} },
 'adm-del':async function(el){ if(!armed(el))return; var r=await run(sb.from('listings').delete().eq('id',el.dataset.id)); if(!r.error){toast('Annonce supprimée.');render()} },
 'u-pro':async function(el){ var on=el.dataset.v==='true'; var r=await run(sb.from('profiles').update({is_pro:on,pro_until:on?new Date(Date.now()+30*864e5).toISOString():null}).eq('id',el.dataset.id)); if(!r.error){toast('Compte mis à jour.');render()} },
 'u-ban':async function(el){ var on=el.dataset.v==='true'; if(on&&!armed(el))return; var r=await run(sb.from('profiles').update({banned:on}).eq('id',el.dataset.id)); if(!r.error){toast(on?'Utilisateur banni.':'Utilisateur réactivé.');render()} },
 'rep-done':async function(el){ var r=await run(sb.from('reports').update({status:'resolved'}).eq('id',el.dataset.id)); if(!r.error){toast('Signalement traité.');render()} },
 'cat-save':async function(el){ var s=el.dataset.slug; var r=await run(sb.from('categories').update({name:$('#cn-'+s).value,sort:Number($('#co-'+s).value)||0}).eq('slug',s)); if(!r.error){toast('Catégorie enregistrée.');await loadCats()} },
 'cat-del':async function(el){ if(!armed(el))return; var r=await run(sb.from('categories').delete().eq('slug',el.dataset.slug)); if(!r.error){toast('Catégorie supprimée.');render()} },
 'price-save':async function(el){ var k=el.dataset.key; var v=Math.round(Number($('#pr-'+k).value)); if(!(v>=0)){toast('Prix invalide.',true);return} var r=await run(sb.from('pricing').update({amount:v}).eq('key',k)); if(!r.error){toast('Tarif enregistré.');await loadPricing()} },
 'ord-paid':async function(el){
  var r0=await run(sb.from('orders').select('*').eq('id',el.dataset.id).maybeSingle()); var o=r0.data; if(!o)return;
  var r=await run(sb.from('orders').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',o.id)); if(r.error)return;
  await applyOrder(o); toast('Paiement confirmé et offre activée.'+(o.kind==='banner_week'?' Ajoutez la publicité dans l’onglet Publicités.':'')); render();
 },
 'ord-cancel':async function(el){ var r=await run(sb.from('orders').update({status:'cancelled'}).eq('id',el.dataset.id)); if(!r.error){toast('Commande annulée.');render()} },
 'ad-toggle':async function(el){ var r=await run(sb.from('ads').update({active:el.dataset.v==='true'}).eq('id',el.dataset.id)); if(!r.error)render() },
 'ad-del':async function(el){ if(!armed(el))return; var r=await run(sb.from('ads').delete().eq('id',el.dataset.id)); if(!r.error){toast('Publicité supprimée.');render()} }
};
var CHG={
 af:function(el){S.af=el.value;render()},
 'u-role':async function(el){ var r=await run(sb.from('profiles').update({role:el.value}).eq('id',el.dataset.id)); if(!r.error)toast('Rôle mis à jour.'); else render() }
};
function keepForm(f){ if(!f)return; var d=new FormData(f); S.edit=Object.assign({},S.edit||{},{title:d.get('title'),description:d.get('description'),price:d.get('price'),category:d.get('category'),condition:d.get('condition'),whatsapp:d.get('whatsapp'),region:d.get('region'),city:d.get('city')}); }
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=ACT[el.dataset.act];if(!a)return;
  var needs=/^(fav|more|become-seller|del-listing|sold|order|set-status|adm-del|u-|rep-|cat-|price-|ord-|ad-)/.test(el.dataset.act); if(needs&&!db())return; a(el)});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset&&el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});

/* ---------- formulaires ---------- */
function shrink(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var m=1280,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej(new Error('Image illisible'))},'image/jpeg',.8)};img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Image illisible'))};img.src=u})}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)}
function ferr(id,m){var e=$(id);if(e)e.innerHTML=m?'<div class="err" role="alert">'+esc(m)+'</div>':''}
var FORMS={
 search:function(f){var d=new FormData(f);go('annonces',{q:String(d.get('q')||'').trim(),region:d.get('region')||''})},
 filters:function(f){var d=new FormData(f);go('annonces',{q:String(d.get('q')||'').trim(),region:d.get('region'),cat:d.get('cat'),cond:d.get('cond'),min:Number(d.get('min'))||'',max:Number(d.get('max'))||''})},
 config:function(f){var d=new FormData(f);var u=String(d.get('url')||'').trim().replace(/\/+$/,''),k=String(d.get('key')||'').trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)){toast('L’URL doit ressembler à https://xxxx.supabase.co',true);return}
  if(k.length<40){toast('La clé anon public semble incomplète.',true);return}
  try{localStorage.setItem('kj_url',u);localStorage.setItem('kj_key',k)}catch(e){toast('Ce navigateur bloque l’enregistrement. Collez les valeurs dans index.html.',true);return}
  toast('Enregistré. Rechargement…');setTimeout(function(){location.reload()},700)},
 signin:async function(f){ if(!db())return; var d=new FormData(f);
  var r=await sb.auth.signInWithPassword({email:String(d.get('email')).trim(),password:String(d.get('pw'))});
  if(r.error){ferr('#autherr',r.error.message==='Invalid login credentials'?'Email ou mot de passe incorrect.':r.error.message);return}
  toast('Connexion réussie. Bienvenue !'); },
 signup:async function(f){ if(!db())return; var d=new FormData(f); var ph=digits(d.get('phone'));
  if(ph.length<9){ferr('#autherr','Saisissez un numéro WhatsApp valide (9 chiffres, ex. 77 123 45 67).');return}
  var r=await sb.auth.signUp({email:String(d.get('email')).trim(),password:String(d.get('pw')),options:{data:{full_name:String(d.get('name')).trim(),phone:ph,role:d.get('role')}}});
  if(r.error){ferr('#autherr',r.error.message);return}
  if(!r.data.session){ferr('#autherr','');toast('Compte créé. Confirmez votre adresse email avec le lien reçu, puis connectez-vous.');go('connexion',{mode:'in'})}else toast('Compte créé. Bienvenue sur KAY JAAYMA !'); },
 report:async function(f){ if(!db())return; if(!S.user){toast('Connectez-vous pour signaler une annonce.',true);go('connexion',{mode:'in'});return}
  var d=new FormData(f); var reason=d.get('reason')+(d.get('detail')?' : '+String(d.get('detail')).trim():'');
  var r=await run(sb.from('reports').insert({listing_id:f.dataset.id,reporter_id:S.user.id,reason:reason})); if(!r.error){f.hidden=true;toast('Merci. Votre signalement a été transmis à l’équipe.')} },
 shop:async function(f){ var d=new FormData(f); var u={shop_name:String(d.get('shop_name')).trim()||null,shop_description:String(d.get('shop_description')).trim()||null,full_name:String(d.get('full_name')).trim(),phone:digits(d.get('phone'))||null,region:d.get('region')||null,city:String(d.get('city')).trim()||null};
  var r=await run(sb.from('profiles').update(u).eq('id',S.user.id)); if(!r.error){await loadProfile();toast('Boutique enregistrée.');render()} },
 listing:async function(f){
  var d=new FormData(f); var btn=$('#lsub'); var price=Math.round(Number(d.get('price'))); var wa=digits(d.get('whatsapp'));
  var files=Array.from(f.querySelector('#lf').files||[]);
  if(!(price>=0)||String(d.get('price'))===''){ferr('#lerr','Indiquez un prix en FCFA.');return}
  if(wa.length<9){ferr('#lerr','Le numéro WhatsApp doit contenir au moins 9 chiffres.');return}
  if(S.formImgs.length+files.length<1){ferr('#lerr','Ajoutez au moins une photo.');return}
  if(S.formImgs.length+files.length>6){ferr('#lerr','6 photos maximum.');return}
  ferr('#lerr',''); btn.disabled=true; btn.textContent='Envoi en cours…';
  try{
    var urls=S.formImgs.slice();
    for(var i=0;i<files.length;i++){
      btn.textContent='Photo '+(i+1)+' sur '+files.length+'…';
      var blob=await shrink(files[i]); var path=S.user.id+'/'+uid()+'.jpg';
      var up=await sb.storage.from('listings').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
      if(up.error)throw up.error; urls.push(sb.storage.from('listings').getPublicUrl(path).data.publicUrl);
    }
    var row={title:String(d.get('title')).trim(),description:String(d.get('description')).trim(),price:price,category:d.get('category'),condition:d.get('condition'),region:d.get('region'),city:String(d.get('city')).trim()||null,whatsapp:wa,images:urls};
    var r=(S.edit&&S.edit.id)?await sb.from('listings').update(row).eq('id',S.edit.id):await sb.from('listings').insert(Object.assign({seller_id:S.user.id},row));
    if(r.error)throw r.error;
    toast(S.edit&&S.edit.id?'Annonce enregistrée. Elle repasse en validation.':'Annonce envoyée. Elle sera publiée après validation par l’équipe.');
    S.edit=null;S.formImgs=[];S.tab='annonces';render();
  }catch(err){ferr('#lerr',(err&&err.message)||'Envoi impossible. Réessayez.');btn.disabled=false;btn.textContent=S.edit?'Enregistrer':'Envoyer pour validation'}
 },
 newcat:async function(f){var d=new FormData(f);var r=await run(sb.from('categories').insert({slug:String(d.get('slug')).trim(),name:String(d.get('name')).trim(),sort:S.cats.length+1}));if(!r.error){toast('Catégorie ajoutée.');render()}},
 paytext:async function(f){var d=new FormData(f);var r=await run(sb.from('site_settings').upsert({key:'payment_instructions',value:String(d.get('text')).trim()}));if(!r.error){S.pay=String(d.get('text')).trim();toast('Message enregistré.')}},
 newad:async function(f){var d=new FormData(f);var r=await run(sb.from('ads').insert({title:String(d.get('title')).trim(),link_url:d.get('link')||null,image_url:d.get('image')||null,ends_at:d.get('ends')?new Date(d.get('ends')+'T23:59:59').toISOString():null,active:true}));if(!r.error){toast('Publicité publiée sur la page d’accueil.');render()}}
};
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var fn=FORMS[f.dataset.form];if(!fn)return;
  if(!/^(search|filters|config)$/.test(f.dataset.form)&&!db())return; fn(f)});

/* ---------- démarrage ---------- */
(async function init(){
  if(sb){
    try{
      var s=await sb.auth.getSession(); S.user=s.data&&s.data.session?s.data.session.user:null;
      await Promise.all([loadCats(),loadProfile(),loadPricing()]);
      sb.auth.onAuthStateChange(function(ev,sess){
        var nu=sess?sess.user:null; if((nu&&nu.id)===(S.user&&S.user.id))return;
        S.user=nu; setTimeout(async function(){await loadProfile(); if(ev==='SIGNED_IN'&&cur()==='connexion')go(S.profile&&S.profile.role==='seller'?'vendeur':'accueil'); else render()},0);
      });
    }catch(e){}
  }
  render();
})();
})();
</script>
